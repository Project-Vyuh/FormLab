<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Try-On</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Flicker-prevention script.
      // Must be in <head> to run before page is rendered.
      (function() {
        document.documentElement.classList.add('dark');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css" />
</head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<main style="min-height:100vh;background:#171717;color:#fca5a5;padding:2rem;font-family:sans-serif"><h1>FormLab could not start</h1><p>' + String(event.message || 'Unknown startup error').replace(/[&<>]/g, function (character) { return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[character]; }) + '</p></main>';
        }
      });
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
